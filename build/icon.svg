<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Flux app icon: macOS icon grid (824pt squircle on a 1024 canvas), three
       flowing ribbons for "flux".  Rendered to build/flux.icns by scripts/make-icon.js -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#64d2ff"/>
      <stop offset="0.48" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#5e3cf2"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="ribbon" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a237e" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <g clip-path="url(#sq)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="66" filter="url(#ribbon)">
    <path d="M262 382 C 392 282, 532 482, 762 352" stroke-opacity="0.98"/>
    <path d="M262 512 C 392 412, 532 612, 762 482" stroke-opacity="0.72"/>
    <path d="M262 642 C 392 542, 532 742, 762 612" stroke-opacity="0.46"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
</svg>
